<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Declaração de Conteúdo - Cirion</title>
    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Parisienne&family=Sacramento&family=Satisfy&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }
      /* Remove setas de campos numéricos */
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      @media print {
        @page {
          margin: 0;
          size: auto;
        }
        body {
          background-color: white !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #root {
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        /* Utilitários de Impressão Robustos */
        .no-print {
          display: none !important;
        }
        .print-only {
          display: block !important;
        }
        
        /* Força visibilidade na impressão, sobrescrevendo 'hidden' do Tailwind */
        .print-visible {
          display: inline-block !important;
        }
        .print-visible-block {
          display: block !important;
        }
        .print-hidden {
          display: none !important;
        }
        
        /* Reseta estilos de container para impressão */
        .print-reset-container {
          max-width: none !important;
          width: 100% !important;
          box-shadow: none !important;
          border: none !important;
          margin: 0 !important;
          padding: 1cm !important;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BFK2Qyj7.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
